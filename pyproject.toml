[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfhosted-agents-sandbox"
version = "0.2.0"
description = "Durable experiment orchestration with sandboxed agents and pluggable workload and execution adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dario Napolitano" }]
keywords = ["opensandbox", "agents", "sandbox", "harness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "opensandbox>=1.2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psutil>=6,<8",
]
dashboard-test = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/napolitanodario/selfhosted-agents-sandbox"
Repository = "https://github.com/napolitanodario/selfhosted-agents-sandbox"

[project.scripts]
agent-harness = "agent_harness.cli:main"
experimentctl = "experiment_orchestrator.cli:main"
experiment-dashboard = "experiment_dashboard.cli:main"

[tool.setuptools.package-data]
experiment_dashboard = ["static/**/*", "static/*"]

[tool.setuptools.packages.find]
where = ["src"]
