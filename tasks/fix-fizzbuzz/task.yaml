id: fix-fizzbuzz
title: Correggi fizzbuzz
description: L'implementazione di fizzbuzz è incompleta. L'agente deve far passare i test senza modificarli.
image: opensandbox/code-interpreter:v1.1.0
workdir: /workspace
timeout_minutes: 20
ready_timeout_seconds: 180
command_timeout_seconds: 600
resources:
  cpu: "1"
  memory: 1Gi
agent:
  kind: coding-cli
  provider: claude
prompt: |
  Il file fizzbuzz.py restituisce sempre la rappresentazione decimale del numero.
  Correggilo in modo che test_fizzbuzz.py passi con `python -m unittest`.
  Non modificare i test.
checks:
  - name: unit
    command: python -m unittest test_fizzbuzz.py
