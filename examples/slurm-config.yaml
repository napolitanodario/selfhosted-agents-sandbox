# Copy to orchestrator.local.yaml in the repository root and edit the paths.
version: 1
state_dir: .experiments
policy:
  max_active_runs: 2
  max_attempts: 2
  artifact_limit_bytes: 2147483648
repositories:
  open-enricher: ../open-enricher
profiles:
  cpu:
    backend: slurm-ssh
    host: OpenEnricher-Lab
    root: /REPLACE/shared/experiment-jobs
    control_python: python3
    # These settings also default to the values below when omitted. Both profiles
    # share the connection when their destination and SSH connection settings match.
    ssh: &shared_ssh
      persist_seconds: 3600            # Idle retention, not maximum connection age.
      keepalive_seconds: 60
      keepalive_count_max: 3
      connect_timeout_seconds: 10
      command_timeout_seconds: 120
      transfer_timeout_seconds: 1800
    python: python3
    timeout_seconds: 300
    slurm:
      account: REPLACE
      partition: REPLACE
      cpus-per-task: 1
      mem: 1G
      time: '00:05:00'
  gpu:
    backend: slurm-ssh
    host: OpenEnricher-Lab
    root: /REPLACE/shared/experiment-jobs
    control_python: python3
    ssh: *shared_ssh
    # Preprovision the independent workload's dependencies here (Python >=3.11).
    python: /REPLACE/open-enricher/.venv/bin/python
    runtime_id: REPLACE-with-environment-lock-or-container-digest
    video_inputs: /REPLACE/dataset/video_inputs
    synopsis_dir: /REPLACE/open-enricher/synopsis
    timeout_seconds: 172800
    slurm:
      account: REPLACE
      partition: REPLACE
      cpus-per-task: 8
      mem: 32G
      gres: gpu:1
      time: '2-00:00:00'
    # Optional values already present on the execution host, never local SSH secrets.
    # env_from: [CURSOR_API_KEY]
    # env: {PATH: /path/to/ffmpeg/bin:/usr/local/bin:/usr/bin:/bin}
workloads: {}
