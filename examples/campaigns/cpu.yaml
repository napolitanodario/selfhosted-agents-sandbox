version: 1
objective: Compare exact and case-insensitive text deduplication using the fixed cohort.
rubric: Report unique and duplicate counts. Verify the expected count against the actual unique.json. Explain the semantic tradeoff of discarding case differences.
max_runs: 2
baseline:
  version: 1
  experiment_id: dedupe-baseline
  adapter: cpu-dedupe
  profile: cpu
  payload:
    texts: [Alpha, alpha, Beta, Beta]
    case_sensitive: true
    expected_unique: 3
agents:
  proposer: ../agents/researcher/task.yaml
  reviewer: ../agents/researcher/task.yaml
  evaluator: ../agents/researcher/task.yaml
  analyst: ../agents/researcher/task.yaml
